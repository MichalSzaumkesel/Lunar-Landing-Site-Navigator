<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .fav-ring { stroke: #2a3550; stroke-width: 1.5; }
    .fav-ridge { stroke: #2a3550; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .fav-ring { stroke: #566b93; stroke-width: 2; }
      .fav-ridge { stroke: #566b93; stroke-width: 1.2; }
    }
  </style>
  <defs>
    <clipPath id="fav-circle">
      <circle cx="16" cy="16" r="14.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#fav-circle)">
    <circle cx="16" cy="16" r="14.5" fill="#07090f"/>
    <!-- Sun Disc -->
    <circle cx="18" cy="17" r="6" fill="#ffc233"/>
    <!-- Jagged Horizon -->
    <path d="M 0 21 L 9 20 L 16 15 L 23 18 L 32 20 L 32 32 L 0 32 Z" fill="#161d2e" class="fav-ridge"/>
  </g>
  <circle cx="16" cy="16" r="14.5" fill="none" class="fav-ring"/>
</svg>
